name: CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install packaging deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          sudo apt-get install -y --no-install-recommends python3-cryptography python3-minimal python3-pyelftools
          sudo apt-get install -y --no-install-recommends bc bison flex libgnutls28-dev libssl-dev python3-dev python3-jsonschema python3-setuptools python3-yaml swig uuid-dev yamllint

      - name: Set Variables UBOOT, TFA and TI_FIRMWARE
        if: github.ref_type == 'tag'
        run: |
          source ./version.sh
          
          echo "UBOOT=$UBOOT" >> $GITHUB_ENV
          echo "TFA=$TFA" >> $GITHUB_ENV
          echo "TI_FIRMWARE=$TI_FIRMWARE" >> $GITHUB_ENV
          
          echo "Versions loaded from version.sh:"
          echo "  UBOOT: $UBOOT"
          echo "  TFA: $TFA"
          echo "  TI_FIRMWARE: $TI_FIRMWARE"

      - name: Build U-Boot
        run: ./build_u-boot.sh

      - name: Create tarball
        run: tar -cJf "public/bootfs.tar.xz" -C public tiboot3.bin tispl.bin u-boot.img

      - name: Generate os_list.json
        if: github.ref_type == 'tag'
        run: |
          ./tools/gen-os-list.py "${GITHUB_REF##*/}"
            
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            public/tiboot3.bin
            public/tispl.bin
            public/u-boot.img
            public/bootfs.tar.xz
            public/os_list.json
