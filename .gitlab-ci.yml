variables:
  TRANSFER_METER_FREQUENCY: "5s"
  GIT_STRATEGY: "clone"
  GIT_DEPTH: 1
  REGISTRY_BASE: "registry.gfnd.rcn-ee.org:5000/ci"
  PROD_DEBIAN_VER: "13"

before_script:
  - export PATH=/usr/lib/ccache:$PATH
  - export CCACHE_DIR=/dev/shm/my-ccache-in-memory
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"
  - git config --global advice.detachedHead false
  - df -h /dev/shm
  - touch .gitlab-runner

.build_template:
  stage: build
  tags:
    - docker-aarch64-rpi4-ci
  resource_group: $TARGET_LOCK_NAME
  script:
    - ./tools/ci-debian-update.sh
    - ./tools/ci-setup-ccache.sh
    - ./build_u-boot.sh
    - ./tools/ci-cleanup-ccache.sh

build-debian-arm64:
  extends: .build_template
  parallel:
    matrix:
      - DEBIAN_VER: ["14"]
  image: $REGISTRY_BASE/beagle-devscripts-kernel-debian-${DEBIAN_VER}-arm64:latest
  variables:
    TARGET_LOCK_NAME: "lock-debian-$DEBIAN_VER"
  cache:
    key: "$CI_PROJECT_NAME-debian-${DEBIAN_VER}-arm64"
    paths:
      - ccache.tar.zst

pages:
  extends: .build_template
  image: $REGISTRY_BASE/beagle-devscripts-kernel-debian-${PROD_DEBIAN_VER}-arm64:latest
  variables:
    TARGET_LOCK_NAME: "lock-debian-$PROD_DEBIAN_VER"
  cache:
    key: "$CI_PROJECT_NAME-debian-${PROD_DEBIAN_VER}-arm64"
    paths:
      - ccache.tar.zst
  script:
    - !reference [.build_template, script]
    - apindex public
  artifacts:
    when: on_success
    paths:
      - public
  only:
    - main
